<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PMC Math Quest — Mission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/engine.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="index.html">
          <span class="brand-mark">🚂</span>
          <span>PMC Math Quest</span>
        </a>
        <div class="top-stats" id="top-stats"></div>
      </header>

      <div class="player-top">
        <div>
          <span class="eyebrow" id="mod-chapter"></span>
          <h1 id="mod-title"></h1>
        </div>
        <nav class="mode-tabs" id="mode-tabs">
          <button class="mode-tab" data-mode="intro" type="button">🎬 Watch the story</button>
          <button class="mode-tab" data-mode="train" type="button">💪 Train</button>
        </nav>
      </div>

      <section id="intro-zone" class="panel">
        <div class="intro-layout">
          <div id="narrator-root"></div>
          <aside>
            <span class="eyebrow">What you'll master</span>
            <div class="skill-tiles" id="skill-tiles"></div>
            <div class="action-row">
              <button class="btn mint" id="skip-to-train" type="button">I'm ready — train now 💪</button>
            </div>
          </aside>
        </div>
      </section>

      <section id="train-zone" class="hide">
        <!-- enhanced modules take over this zone; legacy uses the generic session below -->
        <div id="enhanced-root"></div>
        <div id="legacy-root">
          <div class="practice-hud">
            <span class="stat-pill small"><span class="ico">⚡</span> <span id="hud-xp">0 XP this visit</span></span>
            <span class="stat-pill small combo-meter"><span class="combo-flame">🔥</span> <span id="hud-combo">combo ×0</span></span>
            <span class="stat-pill small"><span class="ico">📋</span> <span id="hud-count"></span></span>
          </div>
          <div class="mastery-chips" id="mastery-chips"></div>
          <div class="practice-layout">
            <section class="panel">
              <span class="eyebrow" id="q-skill"></span>
              <p class="problem-text" id="q-text"></p>
              <form id="answer-form">
                <div id="answer-host"></div>
                <div class="action-row">
                  <button class="btn primary" id="check-btn" type="submit">Check ✓</button>
                  <button class="btn ghost" id="hint-btn" type="button">💡 Hint</button>
                  <button class="btn ghost" id="why-btn" type="button">👀 Show why</button>
                  <button class="btn mint hide" id="next-btn" type="button">Next →</button>
                </div>
              </form>
              <div id="hint-zone"></div>
              <div class="feedback hide" id="feedback"></div>
              <div id="coach-zone"></div>
            </section>
            <aside class="panel visual-panel">
              <span class="eyebrow">Picture it</span>
              <div class="stage"><div id="visual-host" style="width:100%;height:100%"></div></div>
              <p class="visual-note" id="visual-note"></p>
            </aside>
          </div>
        </div>
      </section>

      <section id="recap-zone" class="panel hide">
        <div class="recap-hero">
          <div class="big-emoji" id="recap-emoji">🎉</div>
          <h2 id="recap-title">Round complete!</h2>
          <p class="muted" id="recap-sub"></p>
        </div>
        <div class="recap-stats">
          <div class="recap-stat"><b id="recap-xp">0</b><span>XP earned</span></div>
          <div class="recap-stat"><b id="recap-acc">0%</b><span>first-try accuracy</span></div>
          <div class="recap-stat"><b id="recap-stars">0</b><span>stars this round</span></div>
        </div>
        <div id="weak-zone"></div>
        <div class="action-row" style="justify-content:center">
          <button class="btn primary" id="recap-again" type="button">🔄 New round</button>
          <button class="btn ghost" id="recap-intro" type="button">🎬 Rewatch story</button>
          <button class="btn ghost" id="recap-home" type="button">🗺️ Mission map</button>
        </div>
      </section>
    </main>
    <script src="assets/engine.js"></script>
    <script src="assets/manifest.js"></script>
    <script src="assets/train_v2.js"></script>
    <script src="assets/player.js"></script>
  </body>
</html>
